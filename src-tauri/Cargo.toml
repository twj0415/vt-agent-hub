[package]
name = "vt-hub-manager"
version = "0.1.0"
description = "VT Hub Manager desktop workspace"
authors = ["Twj"]
edition = "2021"

[lib]
name = "vt_hub_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vt-hub-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
tar = "0.4"
toml = "0.8"
